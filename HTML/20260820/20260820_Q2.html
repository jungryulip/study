<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>함수</title>
	<style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
			font-size: 1.2em;
    }
	</style>
</head>
<body>
	<script>		
	  
		function checkScore() {
    let num = parseInt(prompt('점수를 입력하세요.'));

    if (num >= 60) {
        alert("합격입니다.");
    } else {
        alert("불합격입니다.");
    }
}

checkScore();

	</script>	
</body>
</html>
