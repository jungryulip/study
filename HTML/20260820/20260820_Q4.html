<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>화살표 함수</title>
</head>
<body>
	<script>		

    let discount = (num1, num2) => {
			let result = Math.abs(num1 - num2);
			document.write(`차액 : ${result}원`);
		};

		discount(30000, 5000);

  </script>	
</body>
</html>
