<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>날짜와 시간</title>
</head>
<body>
  <form>
    <h1>날짜 지정하기</h1>
    <input type="date">
    <input type="month">
    <input type="week">
    <hr>
    <h1>시간 지정하기</h1>
    <input type="time">
    <input type="datetime-local">
    <hr>
    <h1>범위 제한하기</h1>
    <input type="date" min="2025-01-01" max="2026-12-30">
    <input type="time">
  
    <fieldset>
        <label> 아이디 : <input type="text" size="10"> </label>
        <label> 비밀번호 : <input type="text" size="10"> </label>
        <input type="image" src="images/login.png" alt="로그인">
    </fieldset>

  </form>
  
</body>
</html>
