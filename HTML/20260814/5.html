<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>레드향 주문하기</title>
  <link rel="stylesheet" href="css/order.css">
</head>

<body>
  <h1>레드향 주문하기</h1>
  <form action="">
    <fieldset>
      <legend>상품 선택</legend>
      <p><b>주문할 상품을 선택해 주세요.</b></p>
      <ul>
        <li>
        <label> <input type="checkbox" value="s_3"> 상품 3kg </label>
        <input type="range" min="0" max="5"> 개 <small> (최대 5개) </small>
        </li>
        <li>
          <label> <input type="checkbox" value="s_5"> 상품 5kg </label>
          <input type="number" min="0" max="3" value="1"> 개 <small> (최대 3개) </small>
        </li>
        <li>
          <label> <input type="checkbox" value="f_3"> 가정 3kg </label>
          <input type="number" min="0" max="5"> 개 <small> (최대 5개) </small>
        </li>
        <li>
          <label> <input type="checkbox" value="f_5"> 가정 5kg </label>
          <input type="number" min="0" max="3"> 개 <small> (최대 3개) </small>
        </li>
      </ul>
      
         <p><b>포장 선택</b></p>
      <ul>
        <li> <label> <input type="radio" name="gift" value="yes"> 선물 포장 </label> </li>
        <li> <label> <input type="radio" name="gift" value="no"> 선물 포장 안함 </label> </li>
      </ul>

    </fieldset>

    <fieldset>
      <legend>배송 정보</legend>
      <ul>
        <li>
          <label for="user-name"> 이름 <input type="text" size="10" id="user-name" autofocus required></label>
          <label for="user-password"> 비밀번호 <input type="password" size="10" id="user-password"></label>
          <input type="submit" value="로그인">
        </li>

        <li>
          <label for="addr"> 배송 주소 </label>
          <input type="text" id="addr" required>
        </li>
        <li>
          <label for="mail"> 메일  </label>
          <input type="email" id="mail">
        </li>
        <li>
          <label for="phone"> 연락처 </label>
          <input type="tel" id="phone" placeholder="하이픈을 빼고 입력해 주세요.(01012345678)" required>
        </li>
        <li>
          <label for="memo"> 메모</label>
          <textarea id="memo" rows="4" cols="40"></textarea>
        </li>
      </ul> 
    </fieldset>
    <div>
      <input type="submit" value="주문하기">
      <input type="reset" value="취소하기">
    </div>
    </form>

</body>
</html>
